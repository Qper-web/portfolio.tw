<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qper Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --black:#090909;--black2:#111111;--black3:#1a1a1a;
    --gold:#c9a84c;--gold2:#e8c97e;--gold3:#f5e4b0;
    --silver:#9ea3aa;--silver2:#c8cdd4;--white:#f0ece4;
    --line:rgba(201,168,76,0.22);
    --font-display:'Cormorant Garamond',serif;
    --font-ui:'Josefin Sans',sans-serif;
    --font-body:'Noto Sans TC',sans-serif;
    --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
    --ease-gold:cubic-bezier(0.4,0,0.2,1);
  }
  html{scroll-behavior:smooth}
  body{background:var(--black);color:var(--white);font-family:var(--font-body);font-weight:300;line-height:1.7;overflow-x:hidden;cursor:none}
  #cursor{width:8px;height:8px;background:var(--gold);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
  #cursor-ring{display:none}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");background-size:180px 180px;pointer-events:none;z-index:2;opacity:0.6}
  ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--black)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
  nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:28px 60px;display:flex;align-items:center;justify-content:space-between;transition:background 0.5s,padding 0.4s}
  nav.scrolled{background:rgba(9,9,9,0.92);backdrop-filter:blur(12px);padding:18px 60px;border-bottom:1px solid var(--line)}
  .nav-logo{font-family:var(--font-display);font-size:1.5rem;font-weight:300;letter-spacing:0.15em;color:var(--gold);text-decoration:none;font-style:italic}
  .nav-logo span{color:var(--white);font-style:normal;font-weight:100}
  .nav-links{display:flex;gap:44px;list-style:none}
  .nav-links a{font-family:var(--font-ui);font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--silver);text-decoration:none;position:relative;padding-bottom:4px;transition:color 0.3s}
  .nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--gold);transition:width 0.35s var(--ease-out-expo)}
  .nav-links a:hover{color:var(--gold2)}.nav-links a:hover::after{width:100%}
  .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
  .hamburger span{display:block;width:24px;height:1px;background:var(--gold);transition:transform 0.35s var(--ease-out-expo),opacity 0.3s}
  .hamburger.active span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .hamburger.active span:nth-child(2){opacity:0}
  .hamburger.active span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .mobile-menu{display:none;position:fixed;inset:0;background:rgba(9,9,9,0.97);z-index:490;flex-direction:column;align-items:center;justify-content:center;gap:48px;opacity:0;pointer-events:none;transition:opacity 0.4s}
  .mobile-menu.active{opacity:1;pointer-events:all}
  .mobile-menu a{font-family:var(--font-display);font-size:2.2rem;font-weight:300;color:var(--white);text-decoration:none;letter-spacing:0.1em;transition:color 0.3s}
  .mobile-menu a:hover{color:var(--gold)}
  #hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 70% 40%,rgba(201,168,76,0.07) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 20% 80%,rgba(201,168,76,0.04) 0%,transparent 60%)}
  .hero-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(201,168,76,0.03) 0px,rgba(201,168,76,0.03) 1px,transparent 1px,transparent 80px);pointer-events:none}
  .hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;max-width:900px}
  .hero-eyebrow{font-family:var(--font-ui);font-size:0.68rem;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;margin-bottom:32px;opacity:0;animation:fadeUp 1s var(--ease-out-expo) 0.3s forwards}
  .hero-title{font-family:var(--font-display);font-size:clamp(3.5rem,9vw,8rem);font-weight:300;line-height:1.08;color:var(--white);margin-bottom:12px;opacity:0;animation:fadeUp 1.2s var(--ease-out-expo) 0.5s forwards}
  .hero-title em{font-style:italic;color:var(--gold);display:block}
  .hero-tagline{font-family:var(--font-ui);font-size:0.78rem;letter-spacing:0.3em;color:var(--silver);text-transform:uppercase;margin-top:28px;margin-bottom:60px;opacity:0;animation:fadeUp 1s var(--ease-out-expo) 0.8s forwards}
  .hero-cta{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-ui);font-size:0.72rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid var(--line);padding:16px 36px;transition:background 0.4s,border-color 0.4s,color 0.4s;opacity:0;animation:fadeUp 1s var(--ease-out-expo) 1s forwards}
  .hero-cta:hover{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.5);color:var(--gold2)}
  .hero-cta svg{transition:transform 0.3s var(--ease-out-expo)}.hero-cta:hover svg{transform:translateX(5px)}
  .hero-scroll{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fadeIn 1s 1.5s forwards}
  .hero-scroll span{font-family:var(--font-ui);font-size:0.6rem;letter-spacing:0.35em;color:var(--silver);text-transform:uppercase}
  .scroll-line{width:1px;height:48px;background:linear-gradient(to bottom,var(--gold),transparent);animation:scrollLine 1.8s ease-in-out 1.8s infinite}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
  section{padding:120px 60px}
  .section-label{font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;margin-bottom:16px}
  .section-title{font-family:var(--font-display);font-size:clamp(2.2rem,5vw,3.8rem);font-weight:300;line-height:1.15;margin-bottom:64px}
  .section-title em{font-style:italic;color:var(--gold)}
  .divider{width:60px;height:1px;background:linear-gradient(to right,var(--gold),transparent);margin-bottom:20px}
  .reveal{opacity:0;transform:translateY(40px);transition:opacity 0.8s var(--ease-out-expo),transform 0.8s var(--ease-out-expo)}
  .reveal.visible{opacity:1;transform:translateY(0)}
  .reveal-delay-1{transition-delay:0.1s}.reveal-delay-2{transition-delay:0.2s}.reveal-delay-3{transition-delay:0.3s}
  #works{background:var(--black);max-width:1600px;margin:0 auto}
  .filter-bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:60px}
  .filter-btn{font-family:var(--font-ui);font-size:0.68rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--silver);background:none;border:1px solid rgba(158,163,170,0.25);padding:10px 22px;cursor:none;transition:color 0.3s,border-color 0.3s,background 0.3s}
  .filter-btn:hover,.filter-btn.active{color:var(--gold);border-color:rgba(201,168,76,0.5);background:rgba(201,168,76,0.06)}
  .portfolio-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
  .card-wide{grid-column:span 8}.card-tall{grid-column:span 4;grid-row:span 2}.card-med{grid-column:span 4}.card-half{grid-column:span 6}.card-third{grid-column:span 4}
  .portfolio-card{position:relative;overflow:hidden;background:var(--black3);cursor:none;aspect-ratio:4/3}
  .card-tall{aspect-ratio:auto}
  .card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.7s var(--ease-out-expo),filter 0.5s;filter:brightness(0.75) saturate(0.85)}
  .portfolio-card:hover .card-img{transform:scale(1.05);filter:brightness(0.9) saturate(1)}
  .card-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-size:1rem;color:rgba(201,168,76,0.3);transition:transform 0.7s var(--ease-out-expo)}
  .portfolio-card:hover .card-placeholder{transform:scale(1.03)}
  .portfolio-card::before{content:'';position:absolute;inset:0;border:1px solid rgba(201,168,76,0);z-index:3;transition:border-color 0.4s;pointer-events:none}
  .portfolio-card:hover::before{border-color:rgba(201,168,76,0.35)}
  .card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,9,0.92) 0%,rgba(9,9,9,0.4) 45%,transparent 70%);z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;transition:background 0.4s}
  .portfolio-card:hover .card-overlay{background:linear-gradient(to top,rgba(9,9,9,0.95) 0%,rgba(9,9,9,0.5) 50%,rgba(9,9,9,0.1) 80%)}
  .card-title{font-family:var(--font-display);font-size:1.35rem;font-weight:300;line-height:1.25;color:var(--white);transform:translateY(6px);transition:transform 0.4s var(--ease-out-expo),color 0.3s}
  .card-arrow{margin-top:12px;opacity:0;transform:translateX(-8px);transition:opacity 0.4s 0.05s,transform 0.4s var(--ease-out-expo);color:var(--gold);font-family:var(--font-ui);font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .portfolio-card:hover .card-title{transform:translateY(0);color:var(--gold2)}
  .portfolio-card:hover .card-arrow{opacity:1;transform:translateX(0)}
  .modal-overlay{position:fixed;inset:0;background:rgba(4,4,4,0.85);backdrop-filter:blur(12px);z-index:800;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.5s ease;padding:0}
  .modal-overlay.active{opacity:1;pointer-events:all}
  .modal-content{max-width:1100px;width:100%;height:100%;position:relative;transform:translateY(60px);transition:transform 0.7s var(--ease-out-expo),opacity 0.7s ease;opacity:0;display:flex;flex-direction:column;background:var(--black2);border-left:1px solid rgba(201,168,76,0.15);border-right:1px solid rgba(201,168,76,0.15);box-shadow:0 0 50px rgba(0,0,0,0.8);margin:0 auto}
  .modal-overlay.active .modal-content{transform:translateY(0);opacity:1}
  .modal-scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--gold) var(--black)}
  .modal-scroll-area::-webkit-scrollbar{width:4px}.modal-scroll-area::-webkit-scrollbar-track{background:var(--black)}.modal-scroll-area::-webkit-scrollbar-thumb{background:var(--gold)}
  .modal-close{position:absolute;top:32px;right:32px;background:rgba(9,9,9,0.5);border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--silver);cursor:none;font-family:var(--font-ui);font-size:0.68rem;letter-spacing:0.3em;text-transform:uppercase;display:flex;align-items:center;gap:10px;transition:all 0.3s var(--ease-out-expo);padding:12px 20px;z-index:50}
  .modal-close:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,0.1);transform:translateY(-2px)}
  .modal-cover{width:100%;height:65vh;min-height:400px;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
  .modal-cover-label{position:absolute;top:28px;left:40px;font-family:var(--font-ui);font-size:0.6rem;letter-spacing:0.4em;text-transform:uppercase;color:rgba(201,168,76,0.7);z-index:5;pointer-events:none}
  .modal-cover .card-placeholder{font-size:1.5rem;height:100%;background:var(--black3);display:flex;align-items:center;justify-content:center}
  .modal-img{width:100%;height:100%;object-fit:cover}
  .modal-header-meta{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:60px 80px 60px;border-bottom:1px solid var(--line);background:var(--black)}
  .modal-title{font-family:var(--font-display);font-size:clamp(2rem,4vw,3.5rem);font-weight:300;line-height:1.15;margin-bottom:16px;color:var(--white)}
  .modal-cat{font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;margin-bottom:24px}
  .modal-desc{color:var(--silver2);font-size:0.95rem;line-height:1.8;font-weight:300}
  .modal-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
  .modal-tag{font-family:var(--font-ui);font-size:0.62rem;letter-spacing:0.25em;text-transform:uppercase;border:1px solid var(--line);padding:8px 16px;color:var(--silver);transition:color 0.3s,border-color 0.3s}
  .modal-tag:hover{color:var(--gold);border-color:var(--gold)}
  .modal-section-label{font-family:var(--font-ui);font-size:0.62rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .modal-gallery{padding:60px 80px 80px;display:flex;flex-direction:column;gap:40px;background:var(--black2)}
  .gallery-item{width:100%;background:transparent;border:none;display:flex;justify-content:center;opacity:0;transform:translateY(30px);transition:opacity 0.8s var(--ease-out-expo),transform 0.8s var(--ease-out-expo);overflow:visible}
  .gallery-item.visible{opacity:1;transform:translateY(0)}
  .gallery-item img{width:100%;max-width:1400px;height:auto;display:block;margin:0 auto}
  #about{background:var(--black2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .about-inner{max-width:1200px;margin:0 auto;display:flex;flex-direction:row !important;flex-wrap:nowrap;gap:64px;align-items:flex-start}
  .about-portrait{flex:0 0 220px;width:220px;aspect-ratio:3/4;background:var(--black3);position:sticky;top:120px;overflow:hidden}
  .about-right{flex:1;min-width:0;padding-top:20px}
  .portrait-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:3.5rem;color:rgba(201,168,76,0.15);font-style:italic}
  .portrait-frame{position:absolute;inset:0;border:1px solid var(--line);pointer-events:none}
  .portrait-corner{position:absolute;width:24px;height:24px;border-color:var(--gold);border-style:solid}
  .portrait-corner.tl{top:12px;left:12px;border-width:1px 0 0 1px}.portrait-corner.tr{top:12px;right:12px;border-width:1px 1px 0 0}
  .portrait-corner.bl{bottom:12px;left:12px;border-width:0 0 1px 1px}.portrait-corner.br{bottom:12px;right:12px;border-width:0 1px 1px 0}
  .about-body{color:var(--silver2);font-size:0.9rem;line-height:1.9;margin-bottom:20px}
  .about-philosophy{border-left:1px solid var(--gold);padding:20px 28px;margin:40px 0;background:rgba(201,168,76,0.04)}
  .about-philosophy p{font-family:var(--font-display);font-style:italic;font-size:1.25rem;font-weight:300;color:var(--gold3);line-height:1.6}
  .about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:48px}
  .stat-item{background:var(--black2);padding:28px 24px;text-align:center}
  .stat-num{font-family:var(--font-display);font-size:2.5rem;font-weight:300;color:var(--gold);display:block}
  .stat-label{font-family:var(--font-ui);font-size:0.6rem;letter-spacing:0.25em;color:var(--silver);text-transform:uppercase;display:block;margin-top:6px}
  #skills{max-width:1200px;margin:0 auto}
  .skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border:1px solid var(--line)}
  .skill-group{background:var(--black);padding:48px 40px}
  .skill-group-title{font-family:var(--font-ui);font-size:0.65rem;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;margin-bottom:36px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .skill-items{display:flex;flex-direction:column;gap:24px}
  .skill-item{display:flex;align-items:center;gap:18px}
  .skill-icon{width:44px;height:44px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem;transition:border-color 0.3s,background 0.3s}
  .skill-item:hover .skill-icon{border-color:rgba(201,168,76,0.5);background:rgba(201,168,76,0.06)}
  .skill-name{font-family:var(--font-ui);font-size:0.78rem;letter-spacing:0.1em;color:var(--silver2);transition:color 0.3s}
  .skill-item:hover .skill-name{color:var(--white)}
  .skill-bar{margin-left:auto;width:60px;height:1px;background:rgba(158,163,170,0.15);position:relative}
  .skill-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--gold);transition:width 1s var(--ease-out-expo)}
  #contact{background:var(--black2);border-top:1px solid var(--line);text-align:center}
  .contact-inner{max-width:700px;margin:0 auto}
  .contact-big{font-family:var(--font-display);font-size:clamp(3rem,8vw,7rem);font-weight:300;line-height:1;margin-bottom:20px;color:var(--white)}
  .contact-big em{font-style:italic;color:var(--gold);display:block}
  .contact-sub{color:var(--silver);font-size:0.88rem;margin-bottom:56px;letter-spacing:0.05em}
  .contact-email{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:1.2rem;color:var(--gold2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:10px;transition:color 0.3s,border-color 0.3s;letter-spacing:0.05em}
  .contact-email:hover{color:var(--gold);border-color:var(--gold)}
  footer{padding:40px 60px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .footer-logo{font-family:var(--font-display);font-size:1rem;font-style:italic;color:var(--gold);letter-spacing:0.1em}
  .footer-copy{font-family:var(--font-ui);font-size:0.6rem;letter-spacing:0.2em;color:rgba(158,163,170,0.5);text-transform:uppercase}
  .bg-g1{background:linear-gradient(135deg,#1a1610 0%,#2a2218 50%,#1c1a14 100%)}
  .bg-g2{background:linear-gradient(135deg,#0f1318 0%,#141c28 50%,#0e1420 100%)}
  .bg-g3{background:linear-gradient(135deg,#181012 0%,#241620 50%,#180e16 100%)}
  .bg-g4{background:linear-gradient(135deg,#0c1410 0%,#141e16 50%,#0c1612 100%)}
  .bg-g5{background:linear-gradient(135deg,#181414 0%,#22191a 50%,#16110f 100%)}
  /* --- Background Flowing Lines --- */
  #flowing-lines-canvas{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none; /* 不攔截任何互動 */
    z-index:0;           /* 最底層 */
  }
  /* 確保所有 body 直接子元素在 canvas 之上 */
  body>*:not(#flowing-lines-canvas):not(#cursor):not(#cursor-ring):not(.modal-overlay){position:relative;z-index:1}
  #cursor{position:fixed!important;z-index:99999!important}
  /* --- End Background Flowing Lines --- */
</style>
</head>
<body>
<canvas id="flowing-lines-canvas" aria-hidden="true"></canvas>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav id="navbar">
  <a href="#hero" class="nav-logo">Qper<span>Portfolio</span></a>
  <ul class="nav-links">
    <li><a href="#works">Works</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="#works" class="mm-link">Works</a>
  <a href="#about" class="mm-link">About</a>
  <a href="#skills" class="mm-link">Skills</a>
  <a href="#contact" class="mm-link">Contact</a>
</div>

<section id="hero">
  <div class="hero-bg"></div>
  <div class="hero-lines"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">Creative Designer &nbsp;&middot;&nbsp; Brand Strategist</p>
    <h1 class="hero-title">Design that<br><em>speaks first.</em></h1>
