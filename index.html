<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qper Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --black:#090909;--black2:#111111;--black3:#1a1a1a;
    --gold:#c9a84c;--gold2:#e8c97e;--gold3:#f5e4b0;
    --silver:#9ea3aa;--silver2:#c8cdd4;--white:#f0ece4;
    --line:rgba(201,168,76,0.22);
    --font-display:'Cormorant Garamond',serif;
    --font-ui:'Josefin Sans',sans-serif;
    --font-body:'Noto Sans TC',sans-serif;
    --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
    --ease-gold:cubic-bezier(0.4,0,0.2,1);
  }
  html{scroll-behavior:smooth}
  body{background:var(--black);color:var(--white);font-family:var(--font-body);font-weight:300;line-height:1.7;overflow-x:hidden;cursor:none}
  #cursor{width:8px;height:8px;background:var(--gold);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
  #cursor-ring{display:none}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");background-size:180px 180px;pointer-events:none;z-index:2;opacity:0.6}
  ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--black)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
  nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:28px 60px;display:flex;align-items:center;justify-content:space-between;transition:background 0.5s,padding 0.4s}
  nav.scrolled{background:rgba(9,9,9,0.92);backdrop-filter:blur(12px);padding:18px 60px;border-bottom:1px solid var(--line)}
  .nav-logo{font-family:var(--font-display);font-size:1.5rem;font-weight:300;letter-spacing:0.15em;color:var(--gold);text-decoration:none;font-style:italic}
  .nav-logo span{color:var(--white);font-style:normal;font-weight:100}
  .nav-links{display:flex;gap:44px;list-style:none}
  .nav-links a{font-family:var(--font-ui);font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--silver);text-decoration:none;position:relative;padding-bottom:4px;transition:color 0.3s}
  .nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--gold);transition:width 0.35s var(--ease-out-expo)}
  .nav-links a:hover{color:var(--gold2)}.nav-links a:hover::after{width:100%}
  .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
  .hamburger span{display:block;width:24px;height:1px;background:var(--gold);transition:transform 0.35s var(--ease-out-expo),opacity 0.3s}
  .hamburger.active span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .hamburger.active span:nth-child(2){opacity:0}
  .hamburger.active span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .mobile-menu{display:none;position:fixed;inset:0;background:rgba(9,9,9,0.97);z-index:490;flex-direction:column;align-items:center;justify-content:center;gap:48px;opacity:0;pointer-events:none;transition:opacity 0.4s}
  .mobile-menu.active{opacity:1;pointer-events:all}
  .mobile-menu a{font-family:var(--font-display);font-size:2.2rem;font-weight:300;color:var(--white);text-decoration:none;letter-spacing:0.1em;transition:color 0.3s}
  .mobile-menu a:hover{color:var(--gold)}
  #hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 70% 40%,rgba(201,168,76,0.07) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 20% 80%,rgba(201,168,76,0.04) 0%,transparent 60%)}
  .hero-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(201,168,76,0.03) 0px,rgba(201,168,76,0.03) 1px,transparent 1px,transparent 80px);pointer-events:none}
  .hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;max-width:900px}
  .hero-eyebrow{font-family:var(--font-ui);font-size:0.68rem;letter-spacing:0.4em;color:var(--gold);text-transform:uppercase;margin-bottom:32px;opacity:0;animation:fadeUp 1s var(--ease-out-expo) 0.3s forwards}
  .hero-title{font-family:var(--font-display);font-size:clamp(3.5rem,9vw,8rem);font-weight:300;line-height:1.08;color:var(--white);margin-bottom:12px;opacity:0;animation:fadeUp 1.2s var(--ease-out-expo) 0.5s forwards}
  .hero-title em{font-style:italic;color:var(--gold);display:block}
  .hero-tagline{font-family:var(--font-ui);font-size:0.78rem;letter-spacing:0.3em;color:var(--silver);text-transform:uppercase;margin-top:28px;margin-bottom:60px;opacity:0;animation:fadeUp 1s var(--ease-out-expo) 0.8s forwards}
  .hero-cta{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-ui);font-size:0.
